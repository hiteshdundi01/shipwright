# Runs `npm run check` on every push and pull request: this repo's own rules,
# a gitleaks scan, and the scripts' tests. No secrets, no dependencies.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install gitleaks
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64) asset=linux_x64 ;;
            macOS-ARM64) asset=darwin_arm64 ;;
            macOS-X64) asset=darwin_x64 ;;
            *) echo "no gitleaks build for $RUNNER_OS-$RUNNER_ARCH"; exit 1 ;;
          esac
          mkdir -p "$HOME/.local/bin"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_${asset}.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: gitleaks version

      - run: npm run check
